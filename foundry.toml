[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
remappings = [
  "@uniswap/v4-core/=lib/v4-hooks-public/lib/v4-periphery/lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-hooks-public/lib/v4-periphery/",
  "v4-hooks-public/=lib/v4-hooks-public/"
]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 256
